[workspace]
resolver = "2"
members = ["sim", "godot-ext"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Rust binding to Godot. `api-4-7` targets the engine the editor runs (4.7.2).
godot = { version = "0.5.5", features = ["api-4-7"] }
